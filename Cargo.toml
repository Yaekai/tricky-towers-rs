[package]
name = "tricky_towers"
version = "0.1.0"
edition = "2024"
description = "Clean-room, moddable reimplementation of a physics brick-stacking game, built on Bevy"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Only the 2D, UI and audio parts of Bevy: the game draws no 3D, so leaving out
# the 3D renderer, glTF and their textures cuts build time and binary size.
bevy = { version = "0.19", default-features = false, features = ["2d", "ui", "audio", "wav"] }
avian2d = "0.7"
serde = { version = "1", features = ["derive"] }
ron = "0.10"
# DEBUG-TOOL: the F1 debug panel (src/debug_panel.rs); build without it with
# `--no-default-features` for the final build (docs/release-checklist.md).
bevy_egui = { version = "0.42", optional = true, default-features = false, features = ["render", "default_fonts", "bevy_ui"] }

[features]
default = ["debug-panel"]
debug-panel = ["dep:bevy_egui"]

# Compile dependencies with optimizations so physics runs at full speed in dev builds.
[profile.dev]
opt-level = 1
# Full debug info for Bevy makes the build folder tens of gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
